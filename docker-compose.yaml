services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    gpus: all
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    # Every Luna app shares this server. Flash attention and an 8-bit KV cache halve
    # the memory of the 16k context the apps request (Qwen3-VL: 7.8 GB -> 6.6 GB).
    # Ollama runs Qwen3-VL requests one at a time ("model architecture does not
    # currently support parallel requests"), so NUM_PARALLEL stays 1; requests queue.
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    # The apps reach Ollama through the monitor, which owns the luna-sentia-ollama name.
    networks:
      sentia_network:
        aliases:
          - luna-sentia-ollama-engine
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Pulls every model in SENTIA_MODELS once; already-downloaded models finish immediately.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ['for model in $$SENTIA_MODELS; do ollama pull "$$model" || exit 1; done']
    environment:
      OLLAMA_HOST: http://luna-sentia-ollama-engine:11434
      SENTIA_MODELS: ${SENTIA_MODELS:-qwen3-vl:8b-instruct qwen3-embedding:0.6b huihui_ai/qwen3-abliterated:14b}
    networks:
      sentia_network:
        aliases:
          - luna-sentia-model-pull
    depends_on:
      ollama:
        condition: service_healthy

  # The image model, Qwen-Image 2.1, in ComfyUI, for apps that make pictures (Luna Socia).
  # It shares the GPU with Ollama by taking turns: the app unloads Ollama's models before
  # an image and ComfyUI's after.
  # Its own page has no sign-in, so it is bound to localhost for the owner's debugging.
  comfyui:
    build: ./comfyui
    image: ghcr.io/pranjallk1995/luna-sentia-comfyui:${LUNA_IMAGE_TAG:-v1.4.0}
    restart: unless-stopped
    gpus: all
    volumes:
      - comfyui_models:/opt/comfyui/models
    # No host port: ComfyUI has no sign-in, so people reach its page only through the
    # monitor's owner-only gate on 19002; Socia and the monitor call it here directly.
    expose:
      - "8188"
    networks:
      sentia_network:
        aliases:
          - luna-sentia-comfyui
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=2)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  # Downloads the image model's files once (about 24 GB); finished files are skipped,
  # and an interrupted download resumes.
  comfyui-pull:
    image: curlimages/curl:8.17.0
    # The volume belongs to root, as ComfyUI runs.
    user: root
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    volumes:
      - comfyui_models:/models
      - ./comfyui/pull-models.sh:/pull-models.sh:ro
    networks:
      sentia_network:
        aliases:
          - luna-sentia-comfyui-pull

  # Every app's model calls pass through the monitor on their way to Ollama: it answers
  # at luna-sentia-ollama:11434, times each call, samples the GPU every second, and
  # stores both in its lunamonitor database. Its page, for the owner, is on 19004.
  monitor:
    build: ./monitor
    image: ghcr.io/pranjallk1995/luna-sentia-monitor:${LUNA_IMAGE_TAG:-v1.4.0}
    restart: unless-stopped
    # For the GPU's counters only; the monitor loads no model.
    gpus: all
    environment:
      DATABASE_URL: postgresql://lunamonitor:${LUNAMONITOR_DB_PASSWORD:-lunasentia-dev}@luna-sentia-db:5432/lunamonitor
      MONITOR_OLLAMA_URL: http://luna-sentia-ollama-engine:11434
      SENTIA_AUTH_PUBLIC_URL: ${SENTIA_AUTH_PUBLIC_URL:-http://localhost:19001}
      SENTIA_MONITOR_PUBLIC_URL: ${SENTIA_MONITOR_PUBLIC_URL:-http://localhost:19004}
      # The owner's MCP server (GPU and model calls, read only); clients add <this>/mcp.
      SENTIA_MCP_PUBLIC_URL: ${SENTIA_MCP_PUBLIC_URL:-http://localhost:19003}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      # Residency: Luna Socia's chat model lives on the GPU and comes back after other
      # models visit; they stay only SENTIA_GUEST_KEEP_ALIVE after their last request.
      SENTIA_RESIDENT_MODEL: ${SENTIA_RESIDENT_MODEL:-huihui_ai/qwen3-abliterated:14b}
      SENTIA_RESIDENT_CONTEXT: ${SENTIA_RESIDENT_CONTEXT:-8192}
      SENTIA_GUEST_KEEP_ALIVE: ${SENTIA_GUEST_KEEP_ALIVE:-2m}
      SENTIA_RESIDENT_IDLE_SECONDS: ${SENTIA_RESIDENT_IDLE_SECONDS:-30}
      SENTIA_COMFYUI_URL: http://luna-sentia-comfyui:8188
      SENTIA_COMFYUI_PUBLIC_URL: ${SENTIA_COMFYUI_PUBLIC_URL:-http://localhost:19002}
      MONITOR_SAMPLE_DAYS: ${MONITOR_SAMPLE_DAYS:-30}
      MONITOR_CALL_DAYS: ${MONITOR_CALL_DAYS:-365}
      # To ask Visia, Lexia, and Vibia about the models they run themselves, outside Ollama.
      LUNAVISIA_API_TOKEN: ${LUNAVISIA_API_TOKEN:-lunavisia-dev-token-for-localhost-only}
      LUNALEXIA_API_TOKEN: ${LUNALEXIA_API_TOKEN:-lunalexia-dev-token-for-localhost-only}
      LUNAVIBIA_API_TOKEN: ${LUNAVIBIA_API_TOKEN:-lunavibia-dev-token-for-localhost-only}
    expose:
      - "11434"
    ports:
      - "127.0.0.1:19004:8000"
      # ComfyUI's page, for the owner only (monitor/app/comfyui_gate.py).
      - "127.0.0.1:19002:8188"
      # The owner's MCP server (monitor/app/mcp_server.py).
      - "127.0.0.1:19003:8001"
    networks:
      sentia_network:
        aliases:
          - luna-sentia-ollama
          - luna-sentia-monitor
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  # The one PostgreSQL server for every Luna app, with pgvector for embeddings. Each app
  # has its own role and database (lunavisia, lunavita, ...), created by postgres-init.
  postgres:
    build: ./postgres
    image: ghcr.io/pranjallk1995/luna-sentia-postgres:${LUNA_IMAGE_TAG:-v1.4.0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentia
      POSTGRES_DB: sentia
      POSTGRES_PASSWORD: ${SENTIA_POSTGRES_PASSWORD:-lunasentia-dev}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      sentia_network:
        aliases:
          - luna-sentia-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentia -d sentia"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Creates each app's role and database, and keeps role passwords in sync with the
  # LUNA<APP>_DB_PASSWORD values; safe to run on every start. The script is part of
  # the postgres image (postgres/init-databases.sh).
  postgres-init:
    image: ghcr.io/pranjallk1995/luna-sentia-postgres:${LUNA_IMAGE_TAG:-v1.4.0}
    entrypoint: ["/bin/sh", "/init-databases.sh"]
    environment:
      PGHOST: luna-sentia-db
      PGUSER: sentia
      PGDATABASE: sentia
      PGPASSWORD: ${SENTIA_POSTGRES_PASSWORD:-lunasentia-dev}
      LUNAAUTH_DB_PASSWORD: ${LUNAAUTH_DB_PASSWORD:-lunasentia-dev}
      LUNAVISIA_DB_PASSWORD: ${LUNAVISIA_DB_PASSWORD:-lunavisia-dev}
      LUNAVITA_DB_PASSWORD: ${LUNAVITA_DB_PASSWORD:-lunavita-dev}
      LUNALUMIA_DB_PASSWORD: ${LUNALUMIA_DB_PASSWORD:-lunalumia-dev}
      LUNAFIORA_DB_PASSWORD: ${LUNAFIORA_DB_PASSWORD:-lunafiora-dev}
      LUNALEXIA_DB_PASSWORD: ${LUNALEXIA_DB_PASSWORD:-lunalexia-dev}
      LUNAVIBIA_DB_PASSWORD: ${LUNAVIBIA_DB_PASSWORD:-lunavibia-dev}
      LUNAMONITOR_DB_PASSWORD: ${LUNAMONITOR_DB_PASSWORD:-lunasentia-dev}
      LUNASOCIA_DB_PASSWORD: ${LUNASOCIA_DB_PASSWORD:-lunasocia-dev}
    networks:
      sentia_network:
        aliases:
          - luna-sentia-db-init
    depends_on:
      postgres:
        condition: service_healthy

  # Single sign-on for every Luna app: one Google sign-in sets the luna_sso cookie for
  # SENTIA_AUTH_COOKIE_DOMAIN, and the apps check it here over the private network.
  # Without a Google client (a fresh clone), the owner signs in with one click, on
  # localhost only. The defaults below are for localhost; luna.sh refuses them once an
  # address is public.
  auth:
    build: ./auth
    image: ghcr.io/pranjallk1995/luna-sentia-auth:${LUNA_IMAGE_TAG:-v1.4.0}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lunaauth:${LUNAAUTH_DB_PASSWORD:-lunasentia-dev}@luna-sentia-db:5432/lunaauth
      SENTIA_AUTH_PUBLIC_URL: ${SENTIA_AUTH_PUBLIC_URL:-http://localhost:19001}
      SENTIA_AUTH_COOKIE_DOMAIN: ${SENTIA_AUTH_COOKIE_DOMAIN:-}
      SENTIA_AUTH_GOOGLE_CLIENT_ID: ${SENTIA_AUTH_GOOGLE_CLIENT_ID:-}
      SENTIA_AUTH_GOOGLE_CLIENT_SECRET: ${SENTIA_AUTH_GOOGLE_CLIENT_SECRET:-}
      SENTIA_AUTH_SECRET: ${SENTIA_AUTH_SECRET:-lunasentia-dev-auth-secret-localhost-only}
      SENTIA_AUTH_OWNER_EMAIL: ${SENTIA_AUTH_OWNER_EMAIL:-}
      # Each app's API token, for deleting a person's data there.
      LUNAVISIA_API_TOKEN: ${LUNAVISIA_API_TOKEN:-lunavisia-dev-token-for-localhost-only}
      LUNAVITA_API_TOKEN: ${LUNAVITA_API_TOKEN:-lunavita-dev-token-for-localhost-only}
      LUNALUMIA_API_TOKEN: ${LUNALUMIA_API_TOKEN:-lunalumia-dev-token-for-localhost-only}
      LUNAFIORA_API_TOKEN: ${LUNAFIORA_API_TOKEN:-lunafiora-dev-token-for-localhost-only}
      LUNALEXIA_API_TOKEN: ${LUNALEXIA_API_TOKEN:-lunalexia-dev-token-for-localhost-only}
      LUNAVIBIA_API_TOKEN: ${LUNAVIBIA_API_TOKEN:-lunavibia-dev-token-for-localhost-only}
      SENTIA_AUTH_SESSION_DAYS: ${SENTIA_AUTH_SESSION_DAYS:-30}
    ports:
      - "127.0.0.1:19001:8000"
    networks:
      sentia_network:
        aliases:
          - luna-sentia-auth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  # One database UI for every Luna app's database on luna-sentia-db.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:19000:8080"
    networks:
      sentia_network:
        aliases:
          - luna-sentia-adminer

volumes:
  ollama_data:
    name: luna_sentia_ollama_data
  postgres_data:
    name: luna_sentia_postgres_data
  comfyui_models:
    name: luna_sentia_comfyui_models

# The shared network every Luna app joins as an external network.
networks:
  sentia_network:
    name: luna_sentia_network
    driver: bridge
