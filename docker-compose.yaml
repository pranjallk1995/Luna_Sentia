services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    gpus: all
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      sentia_network:
        aliases:
          - luna-sentia-ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Pulls every model in SENTIA_MODELS once; already-downloaded models finish immediately.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ['for model in $$SENTIA_MODELS; do ollama pull "$$model" || exit 1; done']
    environment:
      OLLAMA_HOST: http://luna-sentia-ollama:11434
      SENTIA_MODELS: ${SENTIA_MODELS:-qwen2.5vl:7b qwen3-vl:8b-instruct qwen3-embedding:0.6b}
    networks:
      sentia_network:
        aliases:
          - luna-sentia-model-pull
    depends_on:
      ollama:
        condition: service_healthy

  # The one PostgreSQL server for every Luna app, with pgvector for embeddings. Each app
  # has its own role and database (lunavisia, lunavita, ...), created by postgres-init.
  postgres:
    build: ./postgres
    image: luna_sentia-postgres:17-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentia
      POSTGRES_DB: sentia
      POSTGRES_PASSWORD: ${SENTIA_POSTGRES_PASSWORD:?Set SENTIA_POSTGRES_PASSWORD in Luna_Sentia/.env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      sentia_network:
        aliases:
          - luna-sentia-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentia -d sentia"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Creates each app's role and database, and keeps role passwords in sync with the
  # LUNA<APP>_DB_PASSWORD values; safe to run on every start.
  postgres-init:
    image: luna_sentia-postgres:17-pgvector
    entrypoint: ["/bin/sh", "/init-databases.sh"]
    environment:
      PGHOST: luna-sentia-db
      PGUSER: sentia
      PGDATABASE: sentia
      PGPASSWORD: ${SENTIA_POSTGRES_PASSWORD:?Set SENTIA_POSTGRES_PASSWORD in Luna_Sentia/.env}
      LUNAAUTH_DB_PASSWORD: ${LUNAAUTH_DB_PASSWORD:-}
      LUNAVISIA_DB_PASSWORD: ${LUNAVISIA_DB_PASSWORD:-}
      LUNAVITA_DB_PASSWORD: ${LUNAVITA_DB_PASSWORD:-}
      LUNALUMIA_DB_PASSWORD: ${LUNALUMIA_DB_PASSWORD:-}
      LUNAFIORA_DB_PASSWORD: ${LUNAFIORA_DB_PASSWORD:-}
      LUNALEXIA_DB_PASSWORD: ${LUNALEXIA_DB_PASSWORD:-}
    volumes:
      - ./postgres/init-databases.sh:/init-databases.sh:ro
    networks:
      sentia_network:
        aliases:
          - luna-sentia-db-init
    depends_on:
      postgres:
        condition: service_healthy

  # Single sign-on for every Luna app: one Google sign-in sets the luna_sso cookie for
  # SENTIA_AUTH_COOKIE_DOMAIN, and the apps check it here over the private network.
  auth:
    build: ./auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lunaauth:${LUNAAUTH_DB_PASSWORD:?Set LUNAAUTH_DB_PASSWORD in Luna_Sentia/.env}@luna-sentia-db:5432/lunaauth
      SENTIA_AUTH_PUBLIC_URL: ${SENTIA_AUTH_PUBLIC_URL:-http://localhost:19090}
      SENTIA_AUTH_COOKIE_DOMAIN: ${SENTIA_AUTH_COOKIE_DOMAIN:-}
      SENTIA_AUTH_GOOGLE_CLIENT_ID: ${SENTIA_AUTH_GOOGLE_CLIENT_ID:?Set SENTIA_AUTH_GOOGLE_CLIENT_ID in Luna_Sentia/.env}
      SENTIA_AUTH_GOOGLE_CLIENT_SECRET: ${SENTIA_AUTH_GOOGLE_CLIENT_SECRET:?Set SENTIA_AUTH_GOOGLE_CLIENT_SECRET in Luna_Sentia/.env}
      SENTIA_AUTH_SECRET: ${SENTIA_AUTH_SECRET:?Set SENTIA_AUTH_SECRET in Luna_Sentia/.env}
      SENTIA_AUTH_ALLOWED_EMAILS: ${SENTIA_AUTH_ALLOWED_EMAILS:?Set SENTIA_AUTH_ALLOWED_EMAILS in Luna_Sentia/.env}
      SENTIA_AUTH_SESSION_DAYS: ${SENTIA_AUTH_SESSION_DAYS:-30}
    ports:
      - "127.0.0.1:19090:8000"
    networks:
      sentia_network:
        aliases:
          - luna-sentia-auth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  # One database UI for every Luna app's database on luna-sentia-db.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:19080:8080"
    networks:
      sentia_network:
        aliases:
          - luna-sentia-adminer

volumes:
  ollama_data:
    name: luna_sentia_ollama_data
  postgres_data:
    name: luna_sentia_postgres_data

# The shared network every Luna app joins as an external network.
networks:
  sentia_network:
    name: luna_sentia_network
    driver: bridge
